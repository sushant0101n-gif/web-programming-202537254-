
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Explorer</title>
<style>
body{font-family:Arial;background:#fff7ed;color:#431407;margin:0;padding:25px}
main{max-width:750px;margin:auto;text-align:center}
h1{color:#dc2626}
form{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px 0}
input,button{padding:12px;border-radius:8px;font-size:15px}
input{border:1px solid #fdba74;min-width:200px}
button{background:#dc2626;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
.card{background:white;border:2px solid #fdba74;border-radius:18px;padding:24px;margin-top:20px}
.card img{width:180px;height:180px;object-fit:contain}
.card h2{font-size:28px;text-transform:capitalize}
.types{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.type{background:#ffedd5;padding:8px 14px;border-radius:20px;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:20px;text-align:left}
.stat{background:#fff7ed;padding:12px;border-radius:8px;text-transform:capitalize}
.stat strong{float:right}
#status{min-height:24px}
</style>
</head>
<body>
<main>
<h1>⚡ Pokémon Explorer</h1>
<p>Search a Pokémon to see its image, types, abilities, and stats.</p>
<form id="searchForm">
<input id="pokemonName" placeholder="Enter name or ID" value="pikachu" required>
<button id="searchBtn">Search</button>
<button type="button" id="randomBtn">Random Pokémon</button>
</form>
<p id="status">Loading Pokémon...</p>
<section id="result"></section>
</main>
<script>
const input=document.getElementById("pokemonName");
const result=document.getElementById("result");
const statusEl=document.getElementById("status");
const searchBtn=document.getElementById("searchBtn");

async function loadPokemon(value){
 const name=value.trim().toLowerCase();
 if(!name)return;

 searchBtn.disabled=true;
 statusEl.textContent="Loading Pokémon...";
 result.replaceChildren();

 try{
  const response=await fetch(
   `https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(name)}`
  );
  if(!response.ok)throw new Error("Pokémon not found");
  const p=await response.json();

  const card=document.createElement("article");
  card.className="card";

  const image=document.createElement("img");
  image.src=p.sprites.other["official-artwork"].front_default
      ||p.sprites.front_default||"";
  image.alt=p.name;

  const title=document.createElement("h2");
  title.textContent=`#${p.id} ${p.name}`;

  const types=document.createElement("div");
  types.className="types";
  p.types.forEach(item=>{
   const badge=document.createElement("span");
   badge.className="type";
   badge.textContent=item.type.name;
   types.appendChild(badge);
  });

  const abilities=document.createElement("p");
  abilities.textContent="Abilities: "+p.abilities
   .map(a=>a.ability.name.replaceAll("-"," ")).join(", ");

  const stats=document.createElement("div");
  stats.className="stats";
  p.stats.forEach(item=>{
   const box=document.createElement("div");
   box.className="stat";
   const label=document.createElement("span");
   label.textContent=item.stat.name.replaceAll("-"," ");
   const value=document.createElement("strong");
   value.textContent=item.base_stat;
   box.append(label,value);
   stats.appendChild(box);
  });

  card.append(image,title,types,abilities,stats);
  result.appendChild(card);
  statusEl.textContent="Pokémon loaded successfully.";
 }catch(error){
  statusEl.textContent="Pokémon not found. Check the name or ID and try again.";
 }finally{
  searchBtn.disabled=false;
 }
}

document.getElementById("searchForm").addEventListener("submit",event=>{
 event.preventDefault();
 loadPokemon(input.value);
});

document.getElementById("randomBtn").addEventListener("click",()=>{
 const id=Math.floor(Math.random()*1025)+1;
 input.value=id;
 loadPokemon(id);
});

loadPokemon("pikachu");
</script>
</body>
</html>
