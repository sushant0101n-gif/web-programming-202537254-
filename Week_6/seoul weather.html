
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seoul Weather</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#dbeafe,#f0f9ff);margin:0;padding:25px;color:#0f172a}
main{max-width:700px;margin:auto}
header{text-align:center}
h1{color:#0369a1}
.card{background:white;border-radius:18px;padding:25px;margin-top:25px;box-shadow:0 5px 20px #0001}
button{background:#0284c7;color:white;border:0;padding:12px 16px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5}
.temp{font-size:60px;font-weight:bold;color:#0284c7;margin:15px 0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}
.metric{background:#f0f9ff;padding:16px;border-radius:10px}
.metric span{display:block;color:#64748b;font-size:14px}
.metric strong{display:block;font-size:21px;margin-top:8px}
#status{min-height:24px}
</style>
</head>
<body>
<main>
<header>
<h1>🌦️ Seoul Weather</h1>
<p>Live weather from Open-Meteo</p>
</header>
<section class="card">
<button id="refresh">Refresh Weather</button>
<p id="status">Loading weather...</p>
<div id="weather" hidden>
<h2>Seoul, South Korea</h2>
<div id="temp" class="temp">--°C</div>
<h3 id="condition">--</h3>
<p id="updated"></p>
<div class="metrics">
<div class="metric"><span>Feels like</span><strong id="feels">--</strong></div>
<div class="metric"><span>Humidity</span><strong id="humidity">--</strong></div>
<div class="metric"><span>Wind speed</span><strong id="wind">--</strong></div>
<div class="metric"><span>Wind direction</span><strong id="direction">--</strong></div>
</div>
</div>
</section>
</main>
<script>
const API="https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&timezone=Asia%2FSeoul";

const descriptions={
0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",
45:"Fog",48:"Fog",51:"Light drizzle",53:"Moderate drizzle",
55:"Heavy drizzle",61:"Light rain",63:"Moderate rain",65:"Heavy rain",
71:"Light snow",73:"Moderate snow",75:"Heavy snow",
80:"Rain showers",81:"Moderate rain showers",82:"Heavy rain showers",
95:"Thunderstorm",96:"Thunderstorm with hail",99:"Thunderstorm with hail"
};

async function loadWeather(){
 const button=document.getElementById("refresh");
 const status=document.getElementById("status");
 button.disabled=true;
 status.textContent="Loading current weather...";
 try{
  const response=await fetch(API);
  if(!response.ok)throw new Error("Weather request failed");
  const data=await response.json();
  const w=data.current;

  document.getElementById("temp").textContent=w.temperature_2m+"°C";
  document.getElementById("condition").textContent=descriptions[w.weather_code]||"Weather condition unavailable";
  document.getElementById("feels").textContent=w.apparent_temperature+"°C";
  document.getElementById("humidity").textContent=w.relative_humidity_2m+"%";
  document.getElementById("wind").textContent=w.wind_speed_10m+" km/h";
  document.getElementById("direction").textContent=w.wind_direction_10m+"°";
  document.getElementById("updated").textContent="Updated: "+w.time.replace("T"," ")+" (KST)";
  document.getElementById("weather").hidden=false;
  status.textContent="";
 }catch(error){
  status.textContent="Weather could not load. Check your internet and retry.";
 }finally{
  button.disabled=false;
 }
}
document.getElementById("refresh").addEventListener("click",loadWeather);
loadWeather();
</script>
</body>
</html>
