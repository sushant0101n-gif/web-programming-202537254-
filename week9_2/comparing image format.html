
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Format Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 500px;
      margin: auto;
      color: #172033;
      background: #ffffff;
    }

    h2 {
      color: #15803d;
    }

    picture img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    p {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }

    a, button {
      margin: 10px 5px 10px 0;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button {
      background: #15803d;
      color: white;
      border: none;
    }

    a {
      color: #1d4ed8;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
    }

    .skip-link:focus {
      position: static;
    }
  </style>
</head>

<body>

  <h2>Image Format Practice</h2>

  <a href="#my-image" class="skip-link">Skip to image</a>

  <picture id="my-image">
    <source
      type="image/webp"
      srcset="
        https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?fm=webp&w=400&h=200&fit=crop 400w,
        https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?fm=webp&w=800&h=400&fit=crop 800w
      "
      sizes="(max-width: 500px) calc(100vw - 48px), 452px"
    >

    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?fm=jpg&w=800&h=400&fit=crop"
      srcset="
        https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?fm=jpg&w=400&h=200&fit=crop 400w,
        https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?fm=jpg&w=800&h=400&fit=crop 800w
      "
      sizes="(max-width: 500px) calc(100vw - 48px), 452px"
      alt="A beautiful scenic landscape photograph"
      width="800"
      height="400"
      fetchpriority="high"
      decoding="async"
    >
  </picture>

  <button type="button" id="infoButton">
    Show image information
  </button>

  <p id="imageInfo" hidden>
    This image uses WebP when supported by the browser
    and JPEG as a fallback. The srcset attribute allows
    the browser to select an appropriate image size.
  </p>

  <script>
    const button = document.getElementById("infoButton");
    const info = document.getElementById("imageInfo");

    button.addEventListener("click", function() {
      info.hidden = !info.hidden;

      button.textContent = info.hidden
        ? "Show image information"
        : "Hide image information";
    });
  </script>

</body>
</html>
