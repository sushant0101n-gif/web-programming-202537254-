
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search App</title>

    <style>
        :root {
            --dark: #1a2540;
            --accent: #1a56db;
            --bg: #f0f4ff;
            --surf: #ffffff;
            --border: #c8d4f0;
            --text: #1a2340;
            --muted: #5a6a8a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 32px 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #b9c5dc;
            margin-bottom: 0;
        }

        #search-section {
            max-width: 650px;
            margin: 32px auto;
            padding: 0 16px;
        }

        #search-form {
            display: flex;
            gap: 10px;
        }

        #search-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }

        button:hover {
            background: #1447b3;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        #status {
            color: var(--muted);
            margin-top: 12px;
            line-height: 1.5;
        }

        #status.error {
            color: #dc2626;
        }

        #results-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(26, 37, 64, 0.12);
        }

        .cover-wrap {
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e7edfa;
        }

        .book-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .no-cover {
            font-size: 48px;
        }

        .card-body {
            padding: 12px;
        }

        .card-body h3 {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin: 0;
        }

        .card-body p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* Loading skeletons */
        .skeleton {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .skeleton-img {
            height: 230px;
        }

        .skeleton-body {
            padding: 12px;
        }

        .skeleton-line {
            height: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        .skeleton-img,
        .skeleton-line {
            background: linear-gradient(
                90deg,
                #dce4f5 25%,
                #f2f5fc 50%,
                #dce4f5 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff80;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        .empty-panel {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 16px;
            color: var(--muted);
            background: white;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            to { background-position: -200% 0; }
        }

        @media (max-width: 520px) {
            #search-form {
                flex-direction: column;
            }

            #search-form button {
                width: 100%;
            }

            #results-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            #results-section {
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>📚 Book Search</h1>
        <p>Discover your next favorite book</p>
    </header>

    <main>
        <section id="search-section">
            <form id="search-form">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search books…"
                    aria-label="Search by book title or author"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="search-btn">Search</button>
            </form>

            <p id="status" role="status" aria-live="polite">
                Search by book title or author to get started.
            </p>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <div id="results-grid"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const status = document.getElementById('status');
        const grid = document.getElementById('results-grid');
        const btn = document.getElementById('search-btn');

        let activeRequest = 0;

        function setStatus(type, message) {
            status.className = type;
            status.textContent = message;
        }

        function showSkeletons() {
            grid.replaceChildren();

            for (let i = 0; i < 6; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');

                skeleton.innerHTML =
                    '<div class="skeleton-img"></div>' +
                    '<div class="skeleton-body">' +
                        '<div class="skeleton-line"></div>' +
                        '<div class="skeleton-line short"></div>' +
                    '</div>';

                grid.appendChild(skeleton);
            }
        }

        function renderResults(books) {
            grid.replaceChildren();

            books.forEach(book => {
                const card = document.createElement('article');
                card.className = 'book-card';

                const coverWrap = document.createElement('div');
                coverWrap.className = 'cover-wrap';

                if (book.cover_i) {
                    const img = document.createElement('img');

                    img.src =
                        'https://covers.openlibrary.org/b/id/' +
                        encodeURIComponent(book.cover_i) + '-M.jpg';

                    img.alt = 'Cover of ' + (book.title || 'book');
                    img.loading = 'lazy';

                    img.onerror = function() {
                        coverWrap.replaceChildren();

                        const placeholder = document.createElement('div');
                        placeholder.className = 'no-cover';
                        placeholder.textContent = '📚';

                        coverWrap.appendChild(placeholder);
                    };

                    coverWrap.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'no-cover';
                    placeholder.textContent = '📚';

                    coverWrap.appendChild(placeholder);
                }

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';

                const title = document.createElement('h3');
                title.textContent = book.title || 'Unknown title';

                const details = document.createElement('p');
                const author = book.author_name?.[0] || 'Unknown author';
                const year = book.first_publish_year || '';

                details.textContent =
                    author + (year ? ' · ' + year : '');

                cardBody.append(title, details);
                card.append(coverWrap, cardBody);
                grid.appendChild(card);
            });
        }

        async function searchBooks(query) {
            const requestId = ++activeRequest;

            const url =
                'https://openlibrary.org/search.json?q=' +
                encodeURIComponent(query) +
                '&limit=12';

            btn.disabled = true;
            btn.innerHTML =
                '<span class="spinner"></span>Searching…';

            setStatus('', 'Searching for "' + query + '"…');
            showSkeletons();

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();

                if (requestId !== activeRequest) return;

                const books = Array.isArray(data.docs)
                    ? data.docs
                    : [];

                if (books.length === 0) {
                    grid.replaceChildren();

                    const empty = document.createElement('div');
                    empty.className = 'empty-panel';
                    empty.textContent =
                        '📭 No books found for "' + query +
                        '" — try another search.';

                    grid.appendChild(empty);
                    setStatus('empty', 'No results found.');
                    return;
                }

                renderResults(books);

                const count = Number(data.numFound) || books.length;

                setStatus(
                    '',
                    'Found ' + count.toLocaleString() +
                    ' results for "' + query +
                    '". Showing up to ' + books.length + ' books.'
                );

                console.log('Found:', data.numFound);
                console.log('First book:', books[0]);

            } catch (error) {
                if (requestId !== activeRequest) return;

                console.error('Book search failed:', error);
                grid.replaceChildren();

                setStatus(
                    'error',
                    '⚠️ Could not load books. Check your internet connection and try again.'
                );

            } finally {
                if (requestId === activeRequest) {
                    btn.disabled = false;
                    btn.textContent = 'Search';
                }
            }
        }

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const query = input.value.trim();

            if (query) {
                searchBooks(query);
            }
        });
    </script>
</body>
</html>
