<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Profile Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #f8fafc 45%, #dbeafe);
        color: #0f172a;
      }

      .container {
        width: min(92vw, 440px);
      }

      .profile-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #dbeafe;
        border-radius: 22px;
        padding: 26px 24px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(8px);
      }

      .card-top {
        display: flex;
        align-items: center;
        gap: 18px;
        padding-bottom: 18px;
        border-bottom: 2px solid #e2e8f0;
        margin-bottom: 18px;
      }

      .avatar {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-size: 1.4rem;
        font-weight: 700;
        display: grid;
        place-items: center;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
      }

      .label {
        margin: 0 0 7px;
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #64748b;
        font-weight: 700;
      }

      h2 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 2vw, 2rem);
        color: #1d4ed8;
      }

      .student-id {
        color: #475569;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .info-grid {
        display: grid;
        gap: 12px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
      }

      .info-row strong {
        color: #334155;
      }

      .info-row span {
        color: #0f172a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile-card">
        <div class="card-top">
          <div class="avatar">NS</div>
          <div>
            <p class="label">Student Profile</p>
            <h2>Neupane Sushant</h2>
            <span class="student-id">ID: 202537254</span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-row">
            <strong>Major:</strong>
            <span>Computer Engineering</span>
          </div>
          <div class="info-row">
            <strong>Year:</strong>
            <span>2</span>
          </div>
          <div class="info-row">
            <strong>GPA:</strong>
            <span>4.39</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
