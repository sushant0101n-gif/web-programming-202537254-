
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Component</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 30px;
    }

    .card {
      background: white;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    h3 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">

    function Card({ title, children }) {
      return (
        <div className="card">
          <h3>{title}</h3>
          {children}
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h2>Sushant Neupane</h2>
          <p>Computer Engineering Student - Gachon University</p>

          <Card title="My Lecture Topics">
            <ul>
              <li>React Components</li>
              <li>Props and State</li>
              <li>JavaScript</li>
            </ul>
          </Card>

          <Card title="My Homework">
            <p>Build a student portfolio component using React.</p>
            <p>Practice reusable components and props.</p>
          </Card>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>
</html>
