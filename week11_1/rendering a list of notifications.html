
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notifications</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 30px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .notification {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      list-style: none;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Assignment deadline is approaching' },
      { id: 3, type: 'info', message: 'New lecture materials available' },
    ];

    function NotificationItem({ type, message }) {
      const icon = type === 'success'
        ? '✅'
        : type === 'warning'
        ? '⚠️'
        : 'ℹ️';

      return (
        <li className="notification">
          {icon} {message}
        </li>
      );
    }

    function NotificationList() {
      return (
        <div className="container">
          <h2>Sushant's Notifications</h2>

          <ul style={{ padding: 0 }}>
            {notifications.map(n => (
              <NotificationItem
                key={n.id}
                type={n.type}
                message={n.message}
              />
            ))}
          </ul>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <NotificationList />
    );

  </script>

</body>
</html>
