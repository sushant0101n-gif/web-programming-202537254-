function ProfileCard({ name, role, email, avatarUrl = 'https://via.placeholder.com/80' }) {
  return (
    <div style={{ border: '1px solid #ccc', borderRadius: 8, padding: 16, maxWidth: 300 }}>
      <img src={avatarUrl} alt={name} style={{ borderRadius: '50%', width: 80, height: 80 }} />
      <h2>{name}</h2>
      <p>{role}</p>
      <a href={`mailto:${email}`}>{email}</a>
    </div>
  );
}

// Usage
<ProfileCard
  name="Sushant Neupane"
  role="Computer Engineering Student"
  email="202537254@gachon.ac.kr"
/>
