
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validation Styles Demo</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 24px;
    max-width: 400px;
    background: #f8fafc;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    margin-top: 14px;
  }

  input {
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    border: 2px solid #c8d4f0;
    border-radius: 8px;
    outline: none;
    box-sizing: border-box;
    transition: all 0.2s;
  }

  button {
    margin-top: 16px;
    background: #1a56db;
    color: white;
    border: none;
    padding: 11px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }

  /* Green border when valid, but not empty */
  input:valid:not(:placeholder-shown) {
    border-color: #16a34a;
  }

  /* Red border when invalid, but not empty */
  input:invalid:not(:placeholder-shown) {
    border-color: #dc2626;
  }

  /* Blue outline when focused */
  input:focus {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
  }

  button:hover {
    background: #1645b5;
  }
</style>
</head>

<body>

<h2>Validation Styles Demo</h2>

<form>
  <label for="v-email">Email (required)</label>
  <input
    type="email"
    id="v-email"
    required
    placeholder="name@example.com"
  >

  <label for="v-pw">Password (min 8 chars)</label>
  <input
    type="password"
    id="v-pw"
    required
    minlength="8"
    placeholder="At least 8 characters"
  >

  <label for="v-age">Age (18–65)</label>
  <input
    type="number"
    id="v-age"
    required
    min="18"
    max="65"
    placeholder="Your age"
  >

  <button type="submit">Check Validation</button>
</form>

</body>
</html>
