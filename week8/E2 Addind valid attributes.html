
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gachon Registration</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 24px;
    max-width: 420px;
    background: #f0f5f1;
    margin: 30px auto;
  }

  h2 {
    color: #245843;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    margin-top: 14px;
    color: #374151;
  }

  input {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #cbd5d1;
    border-radius: 7px;
    font-size: 14px;
    box-sizing: border-box;
  }

  input:focus {
    border-color: #245843;
    outline: 2px solid #d6eadf;
  }

  button {
    margin-top: 16px;
    background: #245843;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 700;
  }

  button:hover {
    background: #183f2f;
  }
</style>
</head>

<body>

<h2>Gachon Registration</h2>

<form method="post" action="/register">

  <label for="sid">Student ID</label>
  <input
    type="text"
    id="sid"
    name="student_id"
    placeholder="202112345"
    pattern="\d{9}"
    title="Please enter exactly 9 digits."
    required
  >

  <label for="r-email">Email</label>
  <input
    type="email"
    id="r-email"
    name="email"
    placeholder="name@gachon.ac.kr"
    required
  >

  <label for="r-pw">Password</label>
  <input
    type="password"
    id="r-pw"
    name="password"
    placeholder="At least 8 characters"
    minlength="8"
    required
  >

  <label for="r-age">Age</label>
  <input
    type="number"
    id="r-age"
    name="age"
    placeholder="Your age"
    min="16"
    max="100"
    required
  >

  <button type="submit">Register</button>

</form>

</body>
</html>
