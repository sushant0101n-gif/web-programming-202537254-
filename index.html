<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Programming | Project Index</title>
<style>
:root{--paper:#f4f2e9;--ink:#202c27;--muted:#6d7770;--line:#d9ddd2;--green:#245843;--lime:#cce878;--coral:#ec795d;--white:#fffef9;--serif:Georgia,"Times New Roman",serif;--sans:"Trebuchet MS","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit}.shell{width:min(100% - 48px,1040px);margin:auto}header{display:flex;align-items:center;justify-content:space-between;min-height:78px;border-bottom:1px solid var(--line)}.wordmark{display:inline-flex;align-items:center;gap:10px;color:var(--green);font-size:13px;font-weight:800;text-transform:uppercase}.mark{display:grid;width:28px;aspect-ratio:1;place-items:center;border-radius:50%;background:var(--lime);font-family:var(--serif);font-size:18px}.top-note{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}main{padding:70px 0 88px}.intro{display:grid;grid-template-columns:minmax(0,1fr) 205px;align-items:end;gap:34px;margin-bottom:36px}.eyebrow{margin:0 0 13px;color:var(--coral);font-size:12px;font-weight:800;text-transform:uppercase}h1{margin:0;font-family:var(--serif);font-size:clamp(42px,7vw,76px);font-weight:500;line-height:.98}h1 span{color:var(--green);font-style:italic}.intro-aside{border-left:3px solid var(--lime);padding:17px 0 4px 18px;color:var(--muted);font-size:14px}.student-profile{margin:0 0 32px;padding:19px 22px;border-left:4px solid var(--lime);background:var(--green);color:white}.profile-label{display:block;color:var(--lime);font-size:10px;font-weight:800;text-transform:uppercase}.profile-name{margin:4px 0;font-family:var(--serif);font-size:23px}.profile-study{margin:0;color:#ffffffc9;font-size:12px}.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.search-wrap{width:min(100%,400px)}.controls label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.search-wrap input{width:100%;height:46px;padding:0 15px;border:1px solid var(--line);border-radius:4px}.week-list{border-top:1px solid var(--ink)}.week{border-bottom:1px solid var(--line)}.week summary{display:grid;grid-template-columns:62px minmax(0,1fr) auto 24px;align-items:center;gap:14px;min-height:80px;cursor:pointer;list-style:none}.week summary::-webkit-details-marker{display:none}.week-number{color:var(--coral);font-family:var(--serif);font-style:italic}.week-title{font-family:var(--serif);font-size:24px}.week-count{color:var(--muted);font-size:12px}.task-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 0 22px 76px}.task-link{display:flex;align-items:center;justify-content:space-between;min-height:47px;padding:0 12px;border:1px solid var(--line);border-radius:3px;background:var(--white);text-decoration:none}.task-link:hover{border-color:var(--green);background:#f0f6df}.task-link::after{content:"↗";color:var(--green)}footer{display:flex;justify-content:space-between;padding:18px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase}@media(max-width:700px){.shell{width:min(100% - 32px,560px)}main{padding:48px 0}.intro{grid-template-columns:1fr}.task-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:0}.week summary{grid-template-columns:45px minmax(0,1fr) auto 17px}}
</style>
</head>
<body><div class="shell">
<header><div class="wordmark"><span class="mark">W</span>Web Programming</div><div class="top-note">Coursework archive · live</div></header>
<main><section class="intro"><div><p class="eyebrow">A collection of small builds</p><h1>The work, <span>week by week.</span></h1></div><div class="intro-aside">Pick a week to browse its projects. Open any task to view the page.</div></section>
<section class="student-profile"><span class="profile-label">Prepared by</span><h2 class="profile-name">Neupane Sushant</h2><p class="profile-study">Computer Engineering · Gachon University · 3rd Semester</p></section>
<div class="controls"><div class="search-wrap"><label for="project-search">Find a project</label><input id="project-search" type="search" placeholder="Search weeks or tasks..."></div></div>
<section class="week-list" id="week-list" aria-label="Course projects"></section>
</main><footer><span>Web Programming</span><span id="footer-total"></span></footer>
</div>
<script src="project-index.js"></script>
</body></html>
