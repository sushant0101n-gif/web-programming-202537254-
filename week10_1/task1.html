<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 10_1 - Portfolio Assignment</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1f4e79;
      --secondary: #2d6a4f;
      --text: #1b2430;
      --muted: #5d6b7a;
      --line: #dfe7f1;
      --shadow: rgba(31, 78, 121, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #eefaf4);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), #3c7bb4);
      color: white;
      padding: 30px 32px;
    }

    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .content {
      padding: 30px 32px 36px;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .repo-box {
      background: #f7fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px 20px;
      margin-top: 20px;
    }

    .repo-box h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .repo-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--secondary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .live-link {
      display: inline-block;
      margin: 12px 0 0 8px;
      padding: 12px 18px;
      border: 1px solid var(--secondary);
      border-radius: 10px;
      color: var(--secondary);
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .repo-link:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .live-link:hover {
      transform: translateY(-1px);
      background: #edf5ef;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="tag">Week 10 · Part 1</div>
      <h1>Portfolio Assignment</h1>
    </header>

    <section class="content">
      <p>
        This assignment is linked to the portfolio repository provided for Week 10_1.
      </p>

      <div class="repo-box">
        <h2>Repository</h2>
        <p>GitHub: sushant0101n-gif/portfolio</p>
        <a class="repo-link" href="https://github.com/sushant0101n-gif/portfolio" target="_blank" rel="noreferrer">
          Open Repository
        </a>
        <a class="live-link" href="https://sushant0101n-gif.github.io/portfolio/" target="_blank" rel="noreferrer">
          Open Live Page
        </a>
      </div>
    </section>
  </main>
</body>
</html>
