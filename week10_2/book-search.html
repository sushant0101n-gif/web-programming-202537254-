
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 10_2 - Book Search Assignment</title>
  <style>
    :root {
      --green: #205943;
      --cream: #f5f5eb;
      --lime: #c9e86b;
      --orange: #e66c4d;
      --text: #202c26;
      --muted: #65736a;
      --border: #d5d9ce;
      --white: #fffef9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--cream);
      background-image: radial-gradient(#d9ddce 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(32, 89, 67, 0.12);
      overflow: hidden;
    }

    .header {
      background: var(--green);
      color: white;
      padding: 30px 32px;
      border-left: 5px solid var(--lime);
    }

    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--lime);
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: normal;
    }

    .content {
      padding: 30px 32px 36px;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .repo-box {
      background: var(--cream);
      border: 1px solid var(--border);
      border-left: 4px solid var(--lime);
      padding: 22px 20px;
      margin-top: 20px;
    }

    .repo-box h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 1.3rem;
      color: var(--green);
      font-weight: normal;
    }

    .repo-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: var(--green);
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .live-link {
      display: inline-block;
      margin: 12px 0 0 8px;
      padding: 12px 18px;
      border: 1px solid var(--green);
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .repo-link:hover {
      transform: translateY(-2px);
      background: var(--orange);
    }

    .live-link:hover {
      transform: translateY(-2px);
      background: var(--lime);
    }

    @media (max-width: 600px) {
      .content {
        padding: 24px 20px;
      }

      .header {
        padding: 25px 22px;
      }

      .live-link {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="tag">Week 10 · Part 2</div>
      <h1>Book Search App</h1>
    </header>

    <section class="content">
      <p>
        This assignment demonstrates a Book Search application
        using the Open Library API. Users can search for books
        by title or author and explore book covers and details.
      </p>

      <div class="repo-box">
        <h2>Repository</h2>
        <p>GitHub: sushant0101n-gif/webpro-book-search</p>

        <a class="repo-link"
           href="https://github.com/sushant0101n-gif/webpro-book-search"
           target="_blank" rel="noreferrer">
          Open Repository
        </a>

        <a class="live-link"
           href="https://sushant0101n-gif.github.io/webpro-book-search/"
           target="_blank" rel="noreferrer">
          Open Live Page
        </a>
      </div>
    </section>
  </main>
</body>
</html>
```
