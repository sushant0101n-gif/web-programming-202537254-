
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 30px 15px;
    color: #1e293b;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    text-align: center;
    color: #15803d;
}

fieldset {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

legend {
    color: #15803d;
    font-weight: bold;
    padding: 0 8px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: 2px solid #86efac;
    border-color: #15803d;
}

input:not([type="checkbox"]):not([type="range"]):not(:placeholder-shown):valid {
    border: 2px solid #16a34a;
}

input:not([type="checkbox"]):not([type="range"]):not(:placeholder-shown):invalid {
    border: 2px solid #dc2626;
}

.error {
    display: block;
    color: #dc2626;
    font-size: 13px;
    margin-top: 5px;
    min-height: 16px;
}

input[aria-invalid="true"], select[aria-invalid="true"] {
    border: 2px solid #dc2626;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
}

.checkbox-row input {
    width: auto;
}

.checkbox-row label {
    margin: 0;
    font-weight: normal;
}

.range-row {
    margin-top: 20px;
}

input[type="range"] {
    padding: 0;
}

button {
    width: 100%;
    padding: 13px;
    background: #15803d;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

#success-message {
    display: none;
    background: #dcfce7;
    color: #166534;
    padding: 14px;
    border-radius: 6px;
    margin-top: 18px;
}

.note {
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Student Registration</h1>
    <p class="note">Please complete all required fields correctly.</p>

    <form id="registration-form" action="/register" method="post" novalidate>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" required
                   aria-describedby="name-error">
            <span class="error" id="name-error"></span>

            <label for="studentId">Student ID *</label>
            <input type="text" id="studentId" name="studentId"
                   placeholder="9 digits" pattern="\d{9}"
                   title="Student ID must contain exactly 9 digits."
                   required aria-describedby="student-error">
            <span class="error" id="student-error"></span>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">

            <label for="major">Major *</label>
            <select id="major" name="major" required
                    aria-describedby="major-error">
                <option value="">Select your major</option>
                <option>Computer Engineering</option>
                <option>Software Engineering</option>
                <option>Electrical Engineering</option>
                <option>Business Administration</option>
                <option>Artificial Intelligence</option>
            </select>
            <span class="error" id="major-error"></span>
        </fieldset>

        <fieldset>
            <legend>Account Information</legend>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required
                   aria-describedby="email-error">
            <span class="error" id="email-error"></span>

            <label for="password">Password *</label>
            <input type="password" id="password" name="password"
                   placeholder="At least 8 characters"
                   minlength="8" required
                   aria-describedby="password-error">
            <span class="error" id="password-error"></span>

            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Enter password again"
                   required aria-describedby="confirm-error">
            <span class="error" id="confirm-error"></span>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone"
                   placeholder="010-1234-5678"
                   pattern="\d{3}-\d{4}-\d{4}"
                   title="Use this format: 010-1234-5678"
                   aria-describedby="phone-error">
            <span class="error" id="phone-error"></span>
        </fieldset>

        <div class="range-row">
            <label for="experience">
                Years of Coding Experience:
                <output id="experience-value">0 years</output>
            </label>
            <input type="range" id="experience" name="experience"
                   min="0" max="10" value="0">
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="terms" name="terms" required
                   aria-describedby="terms-error">
            <label for="terms">I agree to the terms and conditions *</label>
        </div>
        <span class="error" id="terms-error"></span>

        <button type="submit" id="submit-button" disabled>
            Submit Registration
        </button>

        <div id="success-message" role="status" aria-live="polite">
            Registration form is valid! Your information is ready to submit.
        </div>
    </form>
</div>

<script>
const form = document.getElementById("registration-form");
const submitButton = document.getElementById("submit-button");
const successMessage = document.getElementById("success-message");

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const fields = [
    {
        input: document.getElementById("fullName"),
        error: document.getElementById("name-error"),
        message: "Please enter your full name."
    },
    {
        input: document.getElementById("studentId"),
        error: document.getElementById("student-error"),
        message: "Student ID must contain exactly 9 digits."
    },
    {
        input: document.getElementById("major"),
        error: document.getElementById("major-error"),
        message: "Please select your major."
    },
    {
        input: document.getElementById("email"),
        error: document.getElementById("email-error"),
        message: "Please enter a valid email address."
    },
    {
        input: password,
        error: document.getElementById("password-error"),
        message: "Password must contain at least 8 characters."
    },
    {
        input: confirmPassword,
        error: document.getElementById("confirm-error"),
        message: "Passwords do not match."
    },
    {
        input: document.getElementById("phone"),
        error: document.getElementById("phone-error"),
        message: "Use the format 010-1234-5678."
    },
    {
        input: document.getElementById("terms"),
        error: document.getElementById("terms-error"),
        message: "You must agree to the terms."
    }
];

// Custom password confirmation validation
function checkPasswordMatch() {
    if (confirmPassword.value === "") {
        confirmPassword.setCustomValidity("");
    } else if (confirmPassword.value !== password.value) {
        confirmPassword.setCustomValidity("Passwords do not match.");
    } else {
        confirmPassword.setCustomValidity("");
    }
}

// Show a useful error message for each field
function validateField(input, error, defaultMessage) {
    checkPasswordMatch();

    if (input.validity.valid) {
        error.textContent = "";
        input.setAttribute("aria-invalid", "false");
    } else {
        if (input.validity.valueMissing) {
            error.textContent = defaultMessage;
        } else if (input.validity.typeMismatch) {
            error.textContent = "Please enter a valid value.";
        } else if (input.validity.tooShort) {
            error.textContent = defaultMessage;
        } else if (input.validity.patternMismatch) {
            error.textContent = defaultMessage;
        } else if (input.validity.customError) {
            error.textContent = input.validationMessage;
        } else {
            error.textContent = defaultMessage;
        }

        input.setAttribute("aria-invalid", "true");
    }
}

// Check all fields and enable or disable the button
function updateForm() {
    checkPasswordMatch();

    fields.forEach(function(field) {
        validateField(field.input, field.error, field.message);
    });

    submitButton.disabled = !form.checkValidity();
    successMessage.style.display = "none";
}

// Real-time input event listeners
fields.forEach(function(field) {
    field.input.addEventListener("input", updateForm);
    field.input.addEventListener("change", updateForm);
});

// Password changes also affect confirmation
password.addEventListener("input", updateForm);
confirmPassword.addEventListener("input", updateForm);

// Coding experience slider
const experience = document.getElementById("experience");
const experienceValue = document.getElementById("experience-value");

experience.addEventListener("input", function() {
    const years = Number(experience.value);
    experienceValue.textContent =
        years + (years === 1 ? " year" : " years");
});

// Stop normal submission and validate first
form.addEventListener("submit", function(event) {
    event.preventDefault();

    updateForm();

    if (form.checkValidity()) {
        successMessage.style.display = "block";
        successMessage.textContent =
            "All fields are valid! Registration is ready.";
    } else {
        form.reportValidity();
    }
});

// Initial button state
updateForm();
</script>

</body>
</html>
