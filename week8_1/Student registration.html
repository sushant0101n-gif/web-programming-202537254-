
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: system-ui, sans-serif;
    background: #f0f5f1;
    margin: 0;
    padding: 30px 16px;
    color: #26352d;
  }

  .container {
    max-width: 520px;
    margin: auto;
    background: white;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
  }

  h1 {
    text-align: center;
    color: #245843;
    margin-top: 0;
    font-size: 27px;
  }

  .description {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 25px;
  }

  fieldset {
    border: 1px solid #cbd5d1;
    border-radius: 9px;
    padding: 18px;
    margin-bottom: 22px;
  }

  legend {
    color: #245843;
    font-weight: 700;
    padding: 0 8px;
  }

  label {
    display: block;
    margin: 14px 0 6px;
    font-size: 14px;
    font-weight: 600;
  }

  input:not([type="checkbox"]):not([type="range"]),
  select {
    width: 100%;
    padding: 11px 12px;
    border: 2px solid #d1d9d4;
    border-radius: 7px;
    font: inherit;
    font-size: 14px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  /* Green border for valid, filled fields */
  input:not([type="checkbox"]):not([type="range"]):valid:not(:placeholder-shown),
  select:valid {
    border-color: #16a34a;
  }

  /* Red border for invalid, filled fields */
  input:not([type="checkbox"]):not([type="range"]):invalid:not(:placeholder-shown) {
    border-color: #dc2626;
  }

  input:focus,
  select:focus {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 20px 0;
  }

  .checkbox-row input {
    width: 17px;
    height: 17px;
    accent-color: #245843;
  }

  .checkbox-row label {
    margin: 0;
    font-weight: 500;
  }

  .range-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .range-row output {
    color: #245843;
    background: #e6f1e9;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
  }

  input[type="range"] {
    width: 100%;
    accent-color: #245843;
    cursor: pointer;
  }

  .hint {
    margin: 5px 0 0;
    color: #6b7280;
    font-size: 12px;
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #245843;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: #183f2f;
  }

  .status {
    margin-top: 14px;
    color: #245843;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .container {
      padding: 20px;
    }

    fieldset {
      padding: 14px;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Student Registration</h1>
  <p class="description">
    Fill in your information to register.
  </p>

  <form id="registration-form" method="post" action="/register">

    <fieldset>
      <legend>Personal Info</legend>

      <label for="full-name">Full Name</label>
      <input
        type="text"
        id="full-name"
        name="full_name"
        placeholder="Enter your full name"
        required
      >

      <label for="student-id">Student ID</label>
      <input
        type="text"
        id="student-id"
        name="student_id"
        placeholder="202112345"
        pattern="\d{9}"
        title="Student ID must contain exactly 9 digits."
        required
      >

      <label for="dob">Date of Birth</label>
      <input
        type="date"
        id="dob"
        name="date_of_birth"
      >

      <label for="major">Major</label>
      <select id="major" name="major" required>
        <option value="" selected disabled>Select your major</option>
        <option value="computer-engineering">Computer Engineering</option>
        <option value="software-engineering">Software Engineering</option>
        <option value="business-administration">Business Administration</option>
        <option value="electrical-engineering">Electrical Engineering</option>
        <option value="artificial-intelligence">Artificial Intelligence</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Account Info</legend>

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="name@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="At least 8 characters"
        minlength="8"
        required
      >

      <label for="phone">Phone</label>
      <input
        type="text"
        id="phone"
        name="phone"
        placeholder="010-1234-5678"
        pattern="\d{3}-\d{4}-\d{4}"
        title="Enter your phone number in the format 010-1234-5678."
      >
      <p class="hint">Format: 010-1234-5678</p>

      <label for="experience">Years of Coding Experience</label>
      <div class="range-row">
        <input
          type="range"
          id="experience"
          name="coding_experience"
          min="0"
          max="10"
          value="0"
        >
        <output id="experience-value" for="experience">0 years</output>
      </div>
    </fieldset>

    <div class="checkbox-row">
      <input
        type="checkbox"
        id="terms"
        name="terms"
        required
      >
      <label for="terms">I agree to the terms</label>
    </div>

    <button type="submit">Register Now</button>

    <p class="status" id="status" aria-live="polite"></p>
  </form>
</div>

<script>
  const experience = document.getElementById("experience");
  const experienceValue = document.getElementById("experience-value");
  const form = document.getElementById("registration-form");
  const status = document.getElementById("status");

  experience.addEventListener("input", function() {
    const years = experience.value;
    experienceValue.textContent =
      years + (years === "1" ? " year" : " years");
  });

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (form.checkValidity()) {
      status.textContent =
        "Form validation successful! Registration form is ready.";
    } else {
      form.reportValidity();
    }
  });
</script>

</body>
</html>
