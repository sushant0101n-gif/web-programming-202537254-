
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f0f5f1;
    padding: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
  }

  .login-box {
    width: 100%;
    max-width: 360px;
    padding: 28px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }

  h2 {
    text-align: center;
    color: #245843;
    margin-top: 0;
    margin-bottom: 24px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
  }

  input[type="email"],
  input[type="password"] {
    padding: 11px 13px;
    border: 1px solid #cbd5d1;
    border-radius: 7px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
  }

  input:focus {
    border-color: #245843;
    outline: 2px solid #d6eadf;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
  }

  .checkbox-row label {
    font-weight: normal;
  }

  button {
    background: #245843;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 5px;
  }

  button:hover {
    background: #183f2f;
  }
</style>
</head>

<body>

<div class="login-box">
  <h2>Sign In</h2>

  <form method="post">
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      required
    >

    <div class="checkbox-row">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Remember me</label>
    </div>

    <button type="submit">Sign In</button>
  </form>
</div>

</body>
</html>
